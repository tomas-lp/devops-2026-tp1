# ==============================================================================
# CoffeeQueue - Nginx Configuration (Frontend Container / Cloud Production)
# ==============================================================================
# Este archivo configura el servidor web del contenedor de Frontend para produccion:
# 1. Sirve la Single Page Application (SPA) compilada de React (dist/).
# 2. Actua como Reverse Proxy enrutando las peticiones /api/ hacia la API REST en Render.
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Servir la aplicación estática de React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy hacia la API REST en producción (Render)
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        set $backend "https://coffeequeue-api-latest.onrender.com";
        proxy_pass $backend$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host coffeequeue-api-latest.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
