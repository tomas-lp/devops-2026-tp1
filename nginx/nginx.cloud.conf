worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    proxy_connect_timeout 90s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    server {
        listen 80;
        server_name _;

        location / {
            set $frontend "https://coffeequeue-front-latest.onrender.com";
            proxy_pass $frontend;
            proxy_ssl_server_name on;
            proxy_set_header Host coffeequeue-front-latest.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            set $backend "https://coffeequeue-api-latest.onrender.com";
            proxy_pass $backend$request_uri;
            proxy_ssl_server_name on;
            proxy_set_header Host coffeequeue-api-latest.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}